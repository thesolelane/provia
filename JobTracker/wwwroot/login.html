<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Tracker Pro - Sign In</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            padding: 3rem;
            max-width: 450px;
            width: 100%;
        }
        .logo-section {
            text-align: center;
            margin-bottom: 2rem;
        }
        .logo-icon {
            font-size: 3rem;
            color: #667eea;
            margin-bottom: 1rem;
        }
        .app-title {
            font-size: 1.8rem;
            font-weight: 700;
            color: #333;
            margin-bottom: 0.5rem;
        }
        .app-subtitle {
            color: #666;
            font-size: 0.9rem;
        }
        .login-tabs {
            margin-bottom: 2rem;
        }
        .nav-pills .nav-link {
            border-radius: 25px;
            padding: 0.7rem 1.5rem;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        .nav-pills .nav-link.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .form-floating {
            margin-bottom: 1rem;
        }
        .form-control {
            border-radius: 15px;
            border: 2px solid #e9ecef;
            padding: 0.75rem 1rem;
            transition: all 0.3s ease;
        }
        .form-control:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 15px;
            padding: 0.8rem 2rem;
            font-weight: 600;
            width: 100%;
            transition: all 0.3s ease;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        .language-selector {
            margin-top: 1.5rem;
        }
        .register-link {
            text-align: center;
            margin-top: 2rem;
            padding-top: 1rem;
            border-top: 1px solid #e9ecef;
        }
        .alert {
            border-radius: 15px;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="logo-section">
                <div class="logo-icon">
                    <i class="fas fa-hard-hat"></i>
                </div>
                <h1 class="app-title">Job Tracker Pro</h1>
                <p class="app-subtitle">Construction Management Platform</p>
            </div>

            <div id="alertContainer"></div>

            <ul class="nav nav-pills nav-justified login-tabs" role="tablist">
                <li class="nav-item" role="presentation">
                    <button class="nav-link active" id="admin-tab" data-bs-toggle="pill" data-bs-target="#admin-login" type="button" role="tab">
                        <i class="fas fa-user-tie me-2"></i>Admin
                    </button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" id="user-tab" data-bs-toggle="pill" data-bs-target="#user-login" type="button" role="tab">
                        <i class="fas fa-user me-2"></i>User
                    </button>
                </li>
            </ul>

            <div class="tab-content">
                <!-- Admin Login -->
                <div class="tab-pane fade show active" id="admin-login" role="tabpanel">
                    <form id="adminLoginForm">
                        <div class="form-floating">
                            <input type="email" class="form-control" id="adminEmail" placeholder="admin@company.com" required>
                            <label for="adminEmail"><i class="fas fa-envelope me-2"></i>Email Address</label>
                        </div>
                        <div class="form-floating">
                            <input type="password" class="form-control" id="adminPassword" placeholder="Password" required>
                            <label for="adminPassword"><i class="fas fa-lock me-2"></i>Password</label>
                        </div>
                        <div class="language-selector">
                            <label class="form-label"><i class="fas fa-globe me-2"></i>Language Preference</label>
                            <select class="form-select" id="adminLanguage">
                                <option value="en">English</option>
                                <option value="es">Español</option>
                                <option value="fr">Français</option>
                                <option value="pt">Português</option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-primary mt-3">
                            <i class="fas fa-sign-in-alt me-2"></i>Sign In as Admin
                        </button>
                    </form>
                </div>

                <!-- User Login -->
                <div class="tab-pane fade" id="user-login" role="tabpanel">
                    <form id="userLoginForm">
                        <div class="form-floating">
                            <input type="tel" class="form-control" id="userPhone" placeholder="+1 (555) 123-4567" required>
                            <label for="userPhone"><i class="fas fa-phone me-2"></i>Phone Number</label>
                        </div>
                        <div class="form-floating">
                            <input type="password" class="form-control" id="userPassword" placeholder="Password" required>
                            <label for="userPassword"><i class="fas fa-lock me-2"></i>Password</label>
                        </div>
                        <div class="language-selector">
                            <label class="form-label"><i class="fas fa-globe me-2"></i>Language Preference</label>
                            <select class="form-select" id="userLanguage">
                                <option value="en">English</option>
                                <option value="es">Español</option>
                                <option value="fr">Français</option>
                                <option value="pt">Português</option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-primary mt-3">
                            <i class="fas fa-sign-in-alt me-2"></i>Sign In as User
                        </button>
                    </form>
                </div>
            </div>

            <div class="register-link">
                <p class="mb-2">Don't have an account?</p>
                <a href="#" class="text-decoration-none" onclick="showRegisterModal()">
                    <i class="fas fa-user-plus me-2"></i>Request Access
                </a>
            </div>
        </div>
    </div>

    <!-- Registration Modal -->
    <div class="modal fade" id="registerModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title"><i class="fas fa-user-plus me-2"></i>Request Account Access</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="registerForm">
                        <div class="row">
                            <div class="col-md-6">
                                <div class="form-floating mb-3">
                                    <input type="text" class="form-control" id="regFirstName" required>
                                    <label for="regFirstName">First Name</label>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-floating mb-3">
                                    <input type="text" class="form-control" id="regLastName" required>
                                    <label for="regLastName">Last Name</label>
                                </div>
                            </div>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">Account Type</label>
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="form-check">
                                        <input class="form-check-input" type="radio" name="accountType" id="regAdmin" value="admin" onchange="toggleContactFields()">
                                        <label class="form-check-label" for="regAdmin">
                                            <i class="fas fa-user-tie me-2"></i>Admin (Email required)
                                        </label>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="form-check">
                                        <input class="form-check-input" type="radio" name="accountType" id="regUser" value="user" checked onchange="toggleContactFields()">
                                        <label class="form-check-label" for="regUser">
                                            <i class="fas fa-user me-2"></i>User (Phone required)
                                        </label>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="form-floating mb-3" id="emailField" style="display: none;">
                            <input type="email" class="form-control" id="regEmail">
                            <label for="regEmail">Email Address</label>
                        </div>

                        <div class="form-floating mb-3" id="phoneField">
                            <input type="tel" class="form-control" id="regPhone">
                            <label for="regPhone">Phone Number</label>
                        </div>

                        <div class="form-floating mb-3">
                            <input type="password" class="form-control" id="regPassword" required>
                            <label for="regPassword">Password</label>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Language Preference</label>
                            <select class="form-select" id="regLanguage">
                                <option value="en">English</option>
                                <option value="es">Español</option>
                                <option value="fr">Français</option>
                                <option value="pt">Português</option>
                            </select>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" onclick="submitRegistration()">
                        <i class="fas fa-paper-plane me-2"></i>Submit Request
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Handle admin login
        document.getElementById('adminLoginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            await handleLogin('admin');
        });

        // Handle user login
        document.getElementById('userLoginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            await handleLogin('user');
        });

        async function handleLogin(type) {
            const isAdmin = type === 'admin';
            const email = isAdmin ? document.getElementById('adminEmail').value : null;
            const phoneNumber = isAdmin ? null : document.getElementById('userPhone').value;
            const password = document.getElementById(isAdmin ? 'adminPassword' : 'userPassword').value;
            const languagePreference = document.getElementById(isAdmin ? 'adminLanguage' : 'userLanguage').value;

            try {
                const response = await fetch('/api/QuickAuth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        identifier: isAdmin ? email : phoneNumber,
                        password
                    })
                });

                if (response.ok) {
                    const result = await response.json();
                    
                    // Store user info and token in session
                    sessionStorage.setItem('authToken', result.token);
                    localStorage.setItem('authToken', result.token);
                    localStorage.setItem('userInfo', JSON.stringify(result.user));
                    localStorage.setItem('companyInfo', JSON.stringify({
                        id: result.user.companyId,
                        name: result.user.companyName
                    }));
                    
                    console.log('Login successful - Token stored:', result.token ? 'yes' : 'no');
                    console.log('Login successful - User stored:', result.user ? 'yes' : 'no');
                    
                    // Verify storage was successful
                    const verifyToken = localStorage.getItem('authToken');
                    const verifyUser = localStorage.getItem('userInfo');
                    console.log('Storage verification - Token:', verifyToken ? 'confirmed' : 'failed');
                    console.log('Storage verification - User:', verifyUser ? 'confirmed' : 'failed');
                    
                    showAlert('success', `Welcome ${result.user.firstName}! Redirecting to dashboard...`);
                    
                    // Ensure storage operations complete before redirect
                    setTimeout(() => {
                        // Double-check storage before redirect
                        const finalToken = localStorage.getItem('authToken');
                        const finalUser = localStorage.getItem('userInfo');
                        
                        if (!finalToken || !finalUser) {
                            console.error('Storage failed, attempting to re-store');
                            localStorage.setItem('authToken', result.token);
                            localStorage.setItem('userInfo', JSON.stringify(result.user));
                        }
                        
                        const role = result.user.role;
                        // Use URL parameters as backup for authentication data
                        const authParams = `?token=${encodeURIComponent(result.token)}&user=${encodeURIComponent(JSON.stringify(result.user))}`;
                        
                        if (role === 1510) { // Admin
                            window.location.href = '/auth-test.html' + authParams;
                        } else if (role === 1520) { // Supervisor
                            window.location.href = '/supervisor-dashboard.html' + authParams;
                        } else if (role === 2001) { // Field Operator
                            window.location.href = '/field-operator-dashboard.html' + authParams;
                        } else {
                            window.location.href = '/main-dashboard.html' + authParams;
                        }
                    }, 2000);
                } else {
                    const error = await response.json();
                    showAlert('danger', error.message || 'Login failed');
                }
            } catch (error) {
                showAlert('danger', 'Connection error. Please try again.');
            }
        }

        function showRegisterModal() {
            const modal = new bootstrap.Modal(document.getElementById('registerModal'));
            modal.show();
        }

        function toggleContactFields() {
            const isAdmin = document.getElementById('regAdmin').checked;
            const emailField = document.getElementById('emailField');
            const phoneField = document.getElementById('phoneField');
            
            if (isAdmin) {
                emailField.style.display = 'block';
                phoneField.style.display = 'none';
                document.getElementById('regEmail').required = true;
                document.getElementById('regPhone').required = false;
            } else {
                emailField.style.display = 'none';
                phoneField.style.display = 'block';
                document.getElementById('regEmail').required = false;
                document.getElementById('regPhone').required = true;
            }
        }

        async function submitRegistration() {
            const isAdmin = document.getElementById('regAdmin').checked;
            
            const requestData = {
                firstName: document.getElementById('regFirstName').value,
                lastName: document.getElementById('regLastName').value,
                email: isAdmin ? document.getElementById('regEmail').value : null,
                phoneNumber: isAdmin ? null : document.getElementById('regPhone').value,
                password: document.getElementById('regPassword').value,
                languagePreference: document.getElementById('regLanguage').value,
                requestedRole: isAdmin ? 'Admin' : 'RegularUser'
            };

            try {
                const response = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(requestData)
                });

                if (response.ok) {
                    const result = await response.json();
                    showAlert('success', 'Registration request submitted successfully! Please wait for approval.');
                    bootstrap.Modal.getInstance(document.getElementById('registerModal')).hide();
                } else {
                    const error = await response.json();
                    showAlert('danger', error.message || 'Registration failed');
                }
            } catch (error) {
                showAlert('danger', 'Connection error. Please try again.');
            }
        }

        function showAlert(type, message) {
            const alertContainer = document.getElementById('alertContainer');
            const alert = document.createElement('div');
            alert.className = `alert alert-${type} alert-dismissible fade show`;
            alert.innerHTML = `
                ${message}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            `;
            alertContainer.appendChild(alert);
            
            // Auto-dismiss after 5 seconds
            setTimeout(() => {
                if (alert.parentNode) {
                    alert.remove();
                }
            }, 5000);
        }

        // Initialize
        toggleContactFields();
    </script>
</body>
</html>
