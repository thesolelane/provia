<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PROVIA - Sign In</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: #ffffff;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            padding: 3rem;
            max-width: 450px;
            width: 100%;
        }
        .logo-section {
            text-align: center;
            margin-bottom: 2rem;
        }
        .logo-icon {
            font-size: 3rem;
            color: #FF9500;
            margin-bottom: 1rem;
        }
        .app-title {
            font-size: 1.8rem;
            font-weight: 700;
            color: #333;
            margin-bottom: 0.5rem;
        }
        .app-subtitle {
            color: #666;
            font-size: 0.9rem;
        }
        .login-tabs {
            margin-bottom: 2rem;
        }
        .nav-pills .nav-link {
            border-radius: 25px;
            padding: 0.7rem 1.5rem;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        .nav-pills .nav-link.active {
            background: linear-gradient(135deg, #FF9500 0%, #2F5A7E 100%);
            color: white;
        }
        .form-floating {
            margin-bottom: 1rem;
        }
        .form-control {
            border-radius: 15px;
            border: 2px solid #e9ecef;
            padding: 0.75rem 1rem;
            transition: all 0.3s ease;
        }
        .form-control:focus {
            border-color: #FF9500;
            box-shadow: 0 0 0 0.2rem rgba(255, 149, 0, 0.25);
        }
        .btn-primary {
            background: linear-gradient(135deg, #FF9500 0%, #2F5A7E 100%);
            border: none;
            border-radius: 15px;
            padding: 0.8rem 2rem;
            font-weight: 600;
            width: 100%;
            transition: all 0.3s ease;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 149, 0, 0.4);
        }
        .language-selector {
            margin-top: 1.5rem;
        }
        .register-link {
            text-align: center;
            margin-top: 2rem;
            padding-top: 1rem;
            border-top: 1px solid #e9ecef;
        }
        .alert {
            border-radius: 15px;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="logo-section">
                <div class="logo-icon">
                    <svg width="80" height="80" viewBox="0 0 512 256" xmlns="http://www.w3.org/2000/svg">
                        <g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="26">
                            <path d="M80 48 L176 128 L80 208" stroke="#FF9500"/>
                            <path d="M176 48 L272 128 L176 208" stroke="#2E8CCF"/>
                            <path d="M272 48 L368 128 L272 208" stroke="#163853"/>
                        </g>
                    </svg>
                </div>
                <h1 class="app-title">PROVIA</h1>
                <p class="app-subtitle">Construction Management Platform</p>
            </div>

            <div id="alertContainer"></div>

            <form id="loginForm">
                <div class="form-floating">
                    <input type="email" class="form-control" id="email" placeholder="your.email@company.com" required>
                    <label for="email"><i class="fas fa-envelope me-2"></i>Email Address</label>
                </div>
                <div class="form-floating">
                    <input type="password" class="form-control" id="password" placeholder="Password" required>
                    <label for="password"><i class="fas fa-lock me-2"></i>Password</label>
                </div>
                <div class="language-selector">
                    <label class="form-label"><i class="fas fa-globe me-2"></i>Language Preference</label>
                    <select class="form-select" id="language">
                        <option value="en">English</option>
                        <option value="es">Español</option>
                        <option value="fr">Français</option>
                        <option value="pt">Português</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary mt-3">
                    <i class="fas fa-sign-in-alt me-2"></i>Sign In
                </button>
            </form>

            <div class="register-link">
                <p class="mb-2">Don't have an account?</p>
                <a href="#" class="text-decoration-none" onclick="showRegisterModal()">
                    <i class="fas fa-user-plus me-2"></i>Request Access
                </a>
            </div>
        </div>
    </div>

    <!-- Registration Modal -->
    <div class="modal fade" id="registerModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title"><i class="fas fa-user-plus me-2"></i>Request Account Access</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="registerForm">
                        <div class="row">
                            <div class="col-md-6">
                                <div class="form-floating mb-3">
                                    <input type="text" class="form-control" id="regFirstName" required>
                                    <label for="regFirstName">First Name</label>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-floating mb-3">
                                    <input type="text" class="form-control" id="regLastName" required>
                                    <label for="regLastName">Last Name</label>
                                </div>
                            </div>
                        </div>
                        
                        <div class="form-floating mb-3">
                            <input type="email" class="form-control" id="regEmail" required>
                            <label for="regEmail"><i class="fas fa-envelope me-2"></i>Email Address</label>
                        </div>

                        <div class="form-floating mb-3">
                            <input type="password" class="form-control" id="regPassword" required>
                            <label for="regPassword">Password</label>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Language Preference</label>
                            <select class="form-select" id="regLanguage">
                                <option value="en">English</option>
                                <option value="es">Español</option>
                                <option value="fr">Français</option>
                                <option value="pt">Português</option>
                            </select>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" onclick="submitRegistration()">
                        <i class="fas fa-paper-plane me-2"></i>Submit Request
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Handle unified login
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            await handleLogin();
        });

        async function handleLogin() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const languagePreference = document.getElementById('language').value;

            try {
                const response = await fetch('/api/WorkingAuth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        identifier: email,
                        password,
                        languagePreference
                    })
                });

                if (response.ok) {
                    const result = await response.json();
                    
                    // Store user info and token in session
                    sessionStorage.setItem('authToken', result.token);
                    localStorage.setItem('authToken', result.token);
                    localStorage.setItem('userInfo', JSON.stringify(result.user));
                    localStorage.setItem('companyInfo', JSON.stringify({
                        id: result.user.companyId,
                        name: result.user.companyName
                    }));
                    
                    console.log('Login successful - Token stored:', result.token ? 'yes' : 'no');
                    console.log('Login successful - User stored:', result.user ? 'yes' : 'no');
                    
                    // Verify storage was successful
                    const verifyToken = localStorage.getItem('authToken');
                    const verifyUser = localStorage.getItem('userInfo');
                    console.log('Storage verification - Token:', verifyToken ? 'confirmed' : 'failed');
                    console.log('Storage verification - User:', verifyUser ? 'confirmed' : 'failed');
                    
                    showAlert('success', `Welcome ${result.user.firstName}! Redirecting to dashboard...`);
                    
                    // Ensure storage operations complete before redirect
                    setTimeout(() => {
                        // Double-check storage before redirect
                        const finalToken = localStorage.getItem('authToken');
                        const finalUser = localStorage.getItem('userInfo');
                        
                        if (!finalToken || !finalUser) {
                            console.error('Storage failed, attempting to re-store');
                            localStorage.setItem('authToken', result.token);
                            localStorage.setItem('userInfo', JSON.stringify(result.user));
                        }
                        
                        const role = result.user.role;
                        // Use URL parameters as backup for authentication data
                        const authParams = `?token=${encodeURIComponent(result.token)}&user=${encodeURIComponent(JSON.stringify(result.user))}`;
                        
                        if (role === 1510) { // Admin
                            window.location.href = '/admin-user-management.html' + authParams;
                        } else if (role === 1520) { // Foreman
                            window.location.href = '/supervisor-dashboard.html' + authParams;
                        } else if (role === 1530) { // Supervisor
                            window.location.href = '/supervisor-dashboard.html' + authParams;
                        } else if (role === 2001) { // Field Operator
                            window.location.href = '/field-operator-dashboard.html' + authParams;
                        } else {
                            window.location.href = '/main-dashboard.html' + authParams;
                        }
                    }, 2000);
                } else {
                    const error = await response.json();
                    showAlert('danger', error.message || 'Login failed');
                }
            } catch (error) {
                showAlert('danger', 'Connection error. Please try again.');
            }
        }

        function showRegisterModal() {
            const modal = new bootstrap.Modal(document.getElementById('registerModal'));
            modal.show();
        }

        async function submitRegistration() {
            const requestData = {
                firstName: document.getElementById('regFirstName').value,
                lastName: document.getElementById('regLastName').value,
                email: document.getElementById('regEmail').value,
                password: document.getElementById('regPassword').value,
                languagePreference: document.getElementById('regLanguage').value
            };

            try {
                const response = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(requestData)
                });

                if (response.ok) {
                    const result = await response.json();
                    showAlert('success', 'Registration request submitted successfully! Please wait for approval.');
                    bootstrap.Modal.getInstance(document.getElementById('registerModal')).hide();
                } else {
                    const error = await response.json();
                    showAlert('danger', error.message || 'Registration failed');
                }
            } catch (error) {
                showAlert('danger', 'Connection error. Please try again.');
            }
        }

        function showAlert(type, message) {
            const alertContainer = document.getElementById('alertContainer');
            const alert = document.createElement('div');
            alert.className = `alert alert-${type} alert-dismissible fade show`;
            alert.innerHTML = `
                ${message}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            `;
            alertContainer.appendChild(alert);
            
            // Auto-dismiss after 5 seconds
            setTimeout(() => {
                if (alert.parentNode) {
                    alert.remove();
                }
            }, 5000);
        }
    </script>
</body>
</html>
