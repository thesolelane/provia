<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PROVIA Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { 
            background-color: #f8f9fa; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .dashboard-header {
            background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%);
            color: white;
            padding: 2rem 0;
            margin-bottom: 2rem;
        }
        .role-card {
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            padding: 2rem;
            margin-bottom: 1.5rem;
            transition: transform 0.2s;
        }
        .role-card:hover {
            transform: translateY(-2px);
        }
        .role-badge {
            display: inline-block;
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 1rem;
        }
        .admin-badge { background-color: #dc3545; color: white; }
        .supervisor-badge { background-color: #ffc107; color: #212529; }
        .operator-badge { background-color: #28a745; color: white; }
        .quick-action {
            background: white;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            padding: 1rem;
            text-align: center;
            text-decoration: none;
            color: #495057;
            transition: all 0.2s;
        }
        .quick-action:hover {
            background: #f8f9fa;
            border-color: #007bff;
            color: #007bff;
            text-decoration: none;
        }
        .logout-btn {
            position: absolute;
            top: 1rem;
            right: 1rem;
        }
    </style>
</head>
<body>
    <div class="dashboard-header">
        <div class="container">
            <button class="btn btn-outline-light logout-btn" onclick="logout()">
                <i class="fas fa-sign-out-alt me-2"></i>Logout
            </button>
            <h1><i class="fas fa-tachometer-alt me-3"></i>PROVIA Dashboard</h1>
            <p class="mb-0">Welcome back! Select your workspace below.</p>
        </div>
    </div>

    <div class="container">
        <div id="loading" class="text-center py-5">
            <div class="spinner-border text-primary" role="status"></div>
            <p class="mt-3">Loading your dashboard...</p>
        </div>

        <div id="dashboard-content" style="display: none;">
            <!-- Content will be populated based on user role -->
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function checkAuth() {
            const token = localStorage.getItem('authToken');
            const userInfo = localStorage.getItem('userInfo');
            
            if (!token || !userInfo) {
                window.location.href = '/login.html';
                return false;
            }
            
            return JSON.parse(userInfo);
        }

        function renderDashboard(user) {
            const content = document.getElementById('dashboard-content');
            
            switch(user.role) {
                case 1510: // Admin
                    content.innerHTML = createAdminDashboard(user);
                    break;
                case 1520: // Supervisor
                    content.innerHTML = createSupervisorDashboard(user);
                    break;
                case 2001: // Field Operator
                    content.innerHTML = createFieldOperatorDashboard(user);
                    break;
                default:
                    content.innerHTML = createDefaultDashboard(user);
            }
            
            document.getElementById('loading').style.display = 'none';
            content.style.display = 'block';
        }

        function createAdminDashboard(user) {
            return `
                <div class="role-card">
                    <span class="role-badge admin-badge">Administrator</span>
                    <h3>Hello, ${user.firstName}!</h3>
                    <p class="text-muted">You have full system access. Manage users, oversee all projects, and configure system settings.</p>
                </div>

                <div class="row">
                    <div class="col-md-4 mb-3">
                        <a href="/user-management-admin.html" class="quick-action d-block">
                            <i class="fas fa-users fa-2x mb-2 text-primary"></i>
                            <h5>Team Management</h5>
                            <p class="small mb-0">Manage users, roles & SMS verification</p>
                        </a>
                    </div>
                    <div class="col-md-4 mb-3">
                        <a href="/admin-scheduler.html" class="quick-action d-block">
                            <i class="fas fa-calendar-alt fa-2x mb-2 text-success"></i>
                            <h5>Project Scheduler</h5>
                            <p class="small mb-0">Schedule jobs and assign teams</p>
                        </a>
                    </div>
                    <div class="col-md-4 mb-3">
                        <a href="/sms-test.html" class="quick-action d-block">
                            <i class="fas fa-sms fa-2x mb-2 text-warning"></i>
                            <h5>SMS Testing</h5>
                            <p class="small mb-0">Test Twilio SMS functionality</p>
                        </a>
                    </div>
                    <div class="col-md-4 mb-3">
                        <a href="/dashboard.html" class="quick-action d-block">
                            <i class="fas fa-chart-line fa-2x mb-2 text-info"></i>
                            <h5>Analytics</h5>
                            <p class="small mb-0">View reports and statistics</p>
                        </a>
                    </div>
                    <div class="col-md-4 mb-3">
                        <a href="/simple-user-test.html" class="quick-action d-block">
                            <i class="fas fa-mobile-alt fa-2x mb-2 text-danger"></i>
                            <h5>SMS Verification</h5>
                            <p class="small mb-0">Send verification codes to team</p>
                        </a>
                    </div>
                </div>
            `;
        }

        function createSupervisorDashboard(user) {
            return `
                <div class="role-card">
                    <span class="role-badge supervisor-badge">Supervisor</span>
                    <h3>Hello, ${user.firstName}!</h3>
                    <p class="text-muted">Oversee field operations, manage schedules, and coordinate with your team.</p>
                </div>

                <div class="row">
                    <div class="col-md-4 mb-3">
                        <a href="/supervisor-dashboard.html" class="quick-action d-block">
                            <i class="fas fa-clipboard-list fa-2x mb-2 text-primary"></i>
                            <h5>My Projects</h5>
                            <p class="small mb-0">View and manage assigned projects</p>
                        </a>
                    </div>
                    <div class="col-md-4 mb-3">
                        <a href="/admin-scheduler.html" class="quick-action d-block">
                            <i class="fas fa-calendar fa-2x mb-2 text-success"></i>
                            <h5>Schedule</h5>
                            <p class="small mb-0">View team schedules</p>
                        </a>
                    </div>
                    <div class="col-md-4 mb-3">
                        <a href="/field-operator-dashboard.html" class="quick-action d-block">
                            <i class="fas fa-users fa-2x mb-2 text-warning"></i>
                            <h5>Team Status</h5>
                            <p class="small mb-0">Check field operator status</p>
                        </a>
                    </div>
                </div>
            `;
        }

        function createFieldOperatorDashboard(user) {
            return `
                <div class="role-card">
                    <span class="role-badge operator-badge">Field Operator</span>
                    <h3>Hello, ${user.firstName}!</h3>
                    <p class="text-muted">Access your daily tasks, clock in/out, and update job progress.</p>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <a href="/field-operator-dashboard.html" class="quick-action d-block">
                            <i class="fas fa-hammer fa-2x mb-2 text-primary"></i>
                            <h5>My Tasks</h5>
                            <p class="small mb-0">View assignments and clock in/out</p>
                        </a>
                    </div>
                    <div class="col-md-6 mb-3">
                        <a href="/update-coordinates.html" class="quick-action d-block">
                            <i class="fas fa-map-marker-alt fa-2x mb-2 text-success"></i>
                            <h5>Location Check-in</h5>
                            <p class="small mb-0">Update your location and status</p>
                        </a>
                    </div>
                </div>
            `;
        }

        function createDefaultDashboard(user) {
            return `
                <div class="role-card">
                    <h3>Hello, ${user.firstName}!</h3>
                    <p class="text-muted">Your role is being configured. Please contact your administrator.</p>
                </div>
            `;
        }

        function logout() {
            localStorage.removeItem('authToken');
            localStorage.removeItem('userInfo');
            window.location.href = '/login.html';
        }

        // Initialize dashboard
        document.addEventListener('DOMContentLoaded', function() {
            const user = checkAuth();
            if (user) {
                renderDashboard(user);
            }
        });
    </script>
</body>
</html>
