<!DOCTYPE html>
<html>
<head>
    <title>Job Tracker</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .button { background: #007bff; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; margin: 5px; }
        .button:hover { background: #0056b3; }
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); }
        .modal-content { background: white; margin: 10% auto; padding: 20px; width: 50%; border-radius: 10px; }
        .form-group { margin: 10px 0; }
        .form-control { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        .close { float: right; font-size: 28px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>Job Tracker Application</h1>
    <button class="button" onclick="showModal()">Create New Job</button>
    <button class="button" onclick="refreshJobs()">Refresh Jobs</button>
    
    <div id="jobsList">Loading jobs...</div>

    <div id="modal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="hideModal()">&times;</span>
            <h2>Create New Job</h2>
            
            <div class="form-group">
                <label>Job Name:</label>
                <input type="text" id="name" class="form-control">
            </div>
            <div class="form-group">
                <label>Job Number:</label>
                <input type="text" id="number" class="form-control">
            </div>
            <div class="form-group">
                <label>Location:</label>
                <input type="text" id="location" class="form-control">
            </div>
            <div class="form-group">
                <label>Description:</label>
                <textarea id="description" class="form-control" rows="3"></textarea>
            </div>
            <div class="form-group">
                <label>Start Date:</label>
                <input type="date" id="startDate" class="form-control">
            </div>
            <div class="form-group">
                <label>Budget:</label>
                <input type="number" id="budget" class="form-control">
            </div>
            
            <button class="button" onclick="createJob()">Create Job</button>
            <button class="button" onclick="hideModal()">Cancel</button>
            
            <div id="status"></div>
        </div>
    </div>

    <script>
        function showModal() {
            document.getElementById('modal').style.display = 'block';
        }
        
        function hideModal() {
            document.getElementById('modal').style.display = 'none';
            document.getElementById('status').innerHTML = '';
        }
        
        function createJob() {
            const status = document.getElementById('status');
            status.innerHTML = 'Creating job...';
            
            const jobData = {
                name: document.getElementById('name').value,
                jobNumber: document.getElementById('number').value,
                location: document.getElementById('location').value,
                description: document.getElementById('description').value,
                startDate: document.getElementById('startDate').value,
                budget: parseFloat(document.getElementById('budget').value) || 0
            };
            
            fetch('/api/jobs', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(jobData)
            })
            .then(response => response.json())
            .then(data => {
                status.innerHTML = '<div style="color: green;">Job created successfully!</div>';
                setTimeout(() => {
                    hideModal();
                    refreshJobs();
                }, 2000);
            })
            .catch(error => {
                status.innerHTML = '<div style="color: red;">Error creating job</div>';
                console.error('Error:', error);
            });
        }
        
        function refreshJobs() {
            const container = document.getElementById('jobsList');
            container.innerHTML = 'Loading jobs...';
            
            fetch('/api/jobs')
            .then(response => response.json())
            .then(data => {
                const jobs = data.$values || data;
                
                if (!jobs || jobs.length === 0) {
                    container.innerHTML = '<p>No jobs found.</p>';
                    return;
                }
                
                let html = '<h2>Jobs:</h2>';
                jobs.forEach(job => {
                    html += `
                        <div style="border: 1px solid #ddd; padding: 15px; margin: 10px 0; border-radius: 5px;">
                            <h3>${job.name}</h3>
                            <p><strong>Job #:</strong> ${job.jobNumber}</p>
                            <p><strong>Location:</strong> ${job.location}</p>
                            <p><strong>Status:</strong> ${job.status}</p>
                            <p><strong>Budget:</strong> $${job.budget ? job.budget.toLocaleString() : 'Not set'}</p>
                        </div>
                    `;
                });
                container.innerHTML = html;
            })
            .catch(error => {
                container.innerHTML = '<p>Error loading jobs</p>';
                console.error('Error:', error);
            });
        }
        
        // Load jobs when page loads
        document.addEventListener('DOMContentLoaded', refreshJobs);
    </script>
</body>
</html>
