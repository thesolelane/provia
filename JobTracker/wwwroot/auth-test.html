<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authentication Test</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .log { background: #f5f5f5; padding: 10px; margin: 10px 0; border-radius: 5px; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
    <h1>Authentication Test Page</h1>
    <div id="logs"></div>
    
    <script>
        function log(message, type = 'info') {
            const logsDiv = document.getElementById('logs');
            const logEntry = document.createElement('div');
            logEntry.className = `log ${type}`;
            logEntry.textContent = `${new Date().toLocaleTimeString()}: ${message}`;
            logsDiv.appendChild(logEntry);
            console.log(message);
        }
        
        document.addEventListener('DOMContentLoaded', function() {
            log('Page loaded, checking authentication...');
            
            // Check localStorage
            const token = localStorage.getItem('authToken');
            const userInfo = localStorage.getItem('userInfo');
            
            log(`LocalStorage Token: ${token ? 'EXISTS (length: ' + token.length + ')' : 'MISSING'}`);
            log(`LocalStorage UserInfo: ${userInfo ? 'EXISTS' : 'MISSING'}`);
            
            // Check sessionStorage
            const sessionToken = sessionStorage.getItem('authToken');
            log(`SessionStorage Token: ${sessionToken ? 'EXISTS' : 'MISSING'}`);
            
            // Check URL parameters
            const urlParams = new URLSearchParams(window.location.search);
            const urlToken = urlParams.get('token');
            const urlUser = urlParams.get('user');
            
            log(`URL Token: ${urlToken ? 'EXISTS' : 'MISSING'}`);
            log(`URL User: ${urlUser ? 'EXISTS' : 'MISSING'}`);
            
            if (token && userInfo) {
                try {
                    const user = JSON.parse(userInfo);
                    log(`User parsed successfully: ${user.firstName} ${user.lastName} (Role: ${user.role})`, 'success');
                    
                    if (user.role === 1510) {
                        log('User has admin privileges', 'success');
                    } else {
                        log(`User does not have admin privileges (role: ${user.role})`, 'error');
                    }
                } catch (e) {
                    log(`Failed to parse user info: ${e.message}`, 'error');
                }
            } else if (urlToken && urlUser) {
                log('Using URL parameters for authentication');
                try {
                    localStorage.setItem('authToken', urlToken);
                    localStorage.setItem('userInfo', urlUser);
                    log('Stored URL auth data to localStorage', 'success');
                    
                    // Clean URL
                    window.history.replaceState({}, document.title, window.location.pathname);
                    log('Cleaned URL parameters');
                    
                    // Recheck
                    setTimeout(() => window.location.reload(), 1000);
                } catch (e) {
                    log(`Failed to store auth data: ${e.message}`, 'error');
                }
            } else {
                log('No authentication data found', 'error');
            }
        });
    </script>
</body>
</html>
