<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading - PROVIA</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }
        
        .loading-container {
            text-align: center;
            padding: 40px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-left: 4px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .loading-text {
            font-size: 18px;
            margin-bottom: 10px;
        }
        
        .loading-subtext {
            font-size: 14px;
            opacity: 0.8;
        }
        
        .error-message {
            background: rgba(255, 0, 0, 0.1);
            border: 1px solid rgba(255, 0, 0, 0.3);
            border-radius: 10px;
            padding: 20px;
            margin-top: 20px;
            display: none;
        }
        
        .retry-btn {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 15px;
            transition: background 0.3s ease;
        }
        
        .retry-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body>
    <div class="loading-container">
        <div class="spinner"></div>
        <div class="loading-text">Verifying your access...</div>
        <div class="loading-subtext">Please wait while we check your permissions</div>
        
        <div class="error-message" id="errorMessage">
            <strong>Access Denied</strong>
            <p id="errorText"></p>
            <button class="retry-btn" onclick="window.location.href='/'">Return to Login</button>
        </div>
    </div>

    <script>
        let authCheckTimeout;
        let retryCount = 0;
        const maxRetries = 3;

        async function checkAuthentication() {
            try {
                const token = sessionStorage.getItem('authToken');
                const userInfo = localStorage.getItem('userInfo');
                
                if (!token || !userInfo) {
                    showError('Please log in to continue');
                    setTimeout(() => {
                        window.location.href = '/';
                    }, 2000);
                    return;
                }

                const user = JSON.parse(userInfo);
                
                // Verify token is still valid by making a test API call
                const response = await fetch('/api/Jobs', {
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });

                if (response.status === 401 || response.status === 403) {
                    sessionStorage.removeItem('authToken');
                    localStorage.removeItem('userInfo');
                    showError('Your session has expired. Please log in again.');
                    setTimeout(() => {
                        window.location.href = '/';
                    }, 2000);
                    return;
                }

                // Route based on user role
                redirectBasedOnRole(user.role);
                
            } catch (error) {
                console.error('Authentication check failed:', error);
                retryCount++;
                
                if (retryCount < maxRetries) {
                    setTimeout(checkAuthentication, 2000);
                } else {
                    showError('Unable to verify your access. Please try logging in again.');
                }
            }
        }

        function redirectBasedOnRole(role) {
            // Add a small delay to prevent flashing
            setTimeout(() => {
                switch (role.toLowerCase()) {
                    case 'fieldoperator':
                        window.location.href = '/field-operator-dashboard.html';
                        break;
                    case 'admin':
                        window.location.href = '/dashboard.html';
                        break;
                    case 'supervisor':
                        window.location.href = '/supervisor-dashboard.html';
                        break;
                    default:
                        showError('Invalid user role. Please contact your administrator.');
                }
            }, 1000);
        }

        function showError(message) {
            document.querySelector('.spinner').style.display = 'none';
            document.querySelector('.loading-text').style.display = 'none';
            document.querySelector('.loading-subtext').style.display = 'none';
            
            const errorDiv = document.getElementById('errorMessage');
            const errorText = document.getElementById('errorText');
            
            errorText.textContent = message;
            errorDiv.style.display = 'block';
        }

        // Start authentication check
        document.addEventListener('DOMContentLoaded', function() {
            // Add timeout to prevent indefinite loading
            authCheckTimeout = setTimeout(() => {
                if (retryCount < maxRetries) {
                    showError('Authentication check is taking too long. Please try again.');
                }
            }, 10000);
            
            checkAuthentication();
        });
    </script>
</body>
</html>
