<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clearing Session - Job Tracker Pro</title>
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
        }
        .message {
            text-align: center;
            background: rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
        }
    </style>
</head>
<body>
    <div class="message">
        <h2>Clearing Session Data...</h2>
        <p>This will redirect you to the login page in a moment.</p>
    </div>
    <script>
        // Force clear all session and local storage
        sessionStorage.clear();
        localStorage.clear();
        
        // Clear any cached data
        if ('caches' in window) {
            caches.keys().then(function(names) {
                for (let name of names) {
                    caches.delete(name);
                }
            });
        }
        
        // Redirect to login after cleanup
        setTimeout(() => {
            window.location.href = '/login.html';
        }, 2000);
    </script>
</body>
</html>
