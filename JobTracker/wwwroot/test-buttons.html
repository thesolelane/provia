<!DOCTYPE html>
<html>
<head>
    <title>Button Test</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h3>Button Test</h3>
        <button class="btn btn-outline-primary me-2" onclick="editUser(123)">
            <i class="fas fa-edit"></i> Edit User
        </button>
        <button class="btn btn-outline-danger" onclick="deactivateUser(123)">
            <i class="fas fa-user-slash"></i> Deactivate User
        </button>
    </div>

    <script>
        function editUser(userId) {
            alert('Edit user function called for user ID: ' + userId);
        }

        function deactivateUser(userId) {
            var reason = prompt('Please provide a reason for deactivation (optional):');
            if (reason === null) return;
            
            var notes = prompt('Additional notes (optional):');
            if (notes === null) return;

            if (!confirm('Are you sure you want to permanently deactivate this user?')) {
                return;
            }

            alert('Deactivate user function called for user ID: ' + userId + '\nReason: ' + (reason || 'None') + '\nNotes: ' + (notes || 'None'));
        }
    </script>
</body>
</html>
