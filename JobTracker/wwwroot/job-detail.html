<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Details - PROVIA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .page-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            margin-bottom: 30px;
            border-radius: 8px;
        }
        .detail-card {
            background: white;
            border-radius: 8px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .status-badge {
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 600;
            display: inline-block;
            font-size: 0.9em;
        }
        .status-planning { background-color: #d3d3f1; color: #5a4a99; }
        .status-permits { background-color: #fff3cd; color: #856404; }
        .status-progress { background-color: #cfe2ff; color: #084298; }
        .status-inspection { background-color: #fff5e1; color: #f5a602; }
        .status-completed { background-color: #d1e7dd; color: #0f5132; }
        .section-title {
            font-size: 1.3em;
            font-weight: 700;
            color: #333;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 3px solid #FF9500;
        }
        .permit-item {
            background: #f8f9fa;
            border-left: 4px solid #FF9500;
            padding: 15px;
            margin-bottom: 12px;
            border-radius: 4px;
        }
        .permit-status {
            font-size: 0.85em;
            padding: 4px 12px;
            border-radius: 12px;
            display: inline-block;
            margin-top: 10px;
        }
        .permit-status.pending {
            background: #fff3cd;
            color: #856404;
        }
        .permit-status.approved {
            background: #d1e7dd;
            color: #0f5132;
        }
        .permit-status.submitted {
            background: #cfe2ff;
            color: #084298;
        }
        .loading-spinner {
            text-align: center;
            padding: 40px;
        }
        .info-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        .info-item {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 4px;
        }
        .info-label {
            font-weight: 600;
            color: #666;
            font-size: 0.9em;
            margin-bottom: 5px;
        }
        .info-value {
            font-size: 1.1em;
            color: #333;
        }
        .btn-primary-custom {
            background: #FF9500;
            border: none;
            color: white;
        }
        .btn-primary-custom:hover {
            background: #E68900;
            color: white;
        }
        .permit-wizard-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            color: white;
            padding: 12px 24px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 20px;
        }
        .permit-wizard-btn:hover {
            opacity: 0.9;
            color: white;
            text-decoration: none;
        }
        .empty-state {
            text-align: center;
            padding: 40px;
            color: #999;
        }
    </style>
</head>
<body>
    <div class="container-fluid" style="padding: 20px;">
        <a href="/admin-jobs.html" style="color: #FF9500; text-decoration: none; font-weight: 600; margin-bottom: 20px; display: inline-block;">
            <i class="fas fa-arrow-left me-2"></i>Back to Jobs
        </a>

        <div id="pageContent">
            <div class="loading-spinner">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
                <p class="mt-3">Loading job details...</p>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const jobId = new URLSearchParams(window.location.search).get('id');

        if (!jobId) {
            document.getElementById('pageContent').innerHTML = '<div class="alert alert-danger">Job ID not found</div>';
        } else {
            loadJobDetails();
        }

        async function loadJobDetails() {
            const token = localStorage.getItem('token') || localStorage.getItem('authToken');
            if (!token) {
                document.getElementById('pageContent').innerHTML = '<div class="alert alert-danger">Session expired. Please log in again.</div>';
                return;
            }

            try {
                // Fetch job details
                const jobResponse = await fetch(`/api/jobs/${jobId}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (!jobResponse.ok) {
                    throw new Error('Failed to load job');
                }

                const job = await jobResponse.json();

                // Fetch required permits
                let permitsHtml = '';
                try {
                    const permitsResponse = await fetch(`/api/codeengine/job/${jobId}/required-permits`, {
                        headers: { 'Authorization': `Bearer ${token}` }
                    });
                    
                    if (permitsResponse.ok) {
                        const permits = await permitsResponse.json();
                        if (Array.isArray(permits) && permits.length > 0) {
                            permitsHtml = permits.map(p => `
                                <div class="permit-item">
                                    <strong>${p.permitType || 'Permit'}</strong>
                                    <div class="text-muted small mt-2">${p.description || ''}</div>
                                    <span class="permit-status pending">
                                        <i class="fas fa-clock me-1"></i>Pending
                                    </span>
                                </div>
                            `).join('');
                        } else {
                            permitsHtml = '<div class="empty-state"><p>No permits required for this job yet.</p><small>Select scopes using the Job Options Wizard to auto-generate required permits.</small></div>';
                        }
                    }
                } catch (err) {
                    console.error('Error loading permits:', err);
                    permitsHtml = '<div class="alert alert-info">Unable to load permits. Please ensure scopes are selected.</div>';
                }

                const statusClass = `status-${job.status?.toLowerCase() || 'planning'}`;
                const html = `
                    <div class="page-header">
                        <div class="row align-items-center">
                            <div class="col-md-8">
                                <h2 style="margin: 0;">${job.name}</h2>
                                <small style="opacity: 0.9;">${job.jobNumber}</small>
                            </div>
                            <div class="col-md-4 text-end">
                                <span class="status-badge ${statusClass}">${job.status || 'Planning'}</span>
                            </div>
                        </div>
                    </div>

                    <!-- Job Information -->
                    <div class="detail-card">
                        <h4 class="section-title">
                            <i class="fas fa-info-circle me-2" style="color: #FF9500;"></i>Job Information
                        </h4>
                        <div class="info-row">
                            <div class="info-item">
                                <div class="info-label">Location</div>
                                <div class="info-value">${job.location || 'N/A'}</div>
                            </div>
                            <div class="info-item">
                                <div class="info-label">Client</div>
                                <div class="info-value">${job.clientName || 'N/A'}</div>
                            </div>
                        </div>
                        <div class="info-row">
                            <div class="info-item">
                                <div class="info-label">Start Date</div>
                                <div class="info-value">${new Date(job.startDate).toLocaleDateString() || 'N/A'}</div>
                            </div>
                            <div class="info-item">
                                <div class="info-label">Target Completion</div>
                                <div class="info-value">${job.targetCompletionDate ? new Date(job.targetCompletionDate).toLocaleDateString() : 'Not set'}</div>
                            </div>
                        </div>
                        <div class="info-row">
                            <div class="info-item">
                                <div class="info-label">Budget</div>
                                <div class="info-value">$${(job.budget || 0).toLocaleString('en-US', {minimumFractionDigits: 2})}</div>
                            </div>
                            <div class="info-item">
                                <div class="info-label">Spent</div>
                                <div class="info-value">$${(job.actualCost || 0).toLocaleString('en-US', {minimumFractionDigits: 2})}</div>
                            </div>
                        </div>
                        ${job.description ? `<div class="info-item">
                            <div class="info-label">Description</div>
                            <div class="info-value">${job.description}</div>
                        </div>` : ''}
                    </div>

                    <!-- Permits Section -->
                    <div class="detail-card">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                            <h4 class="section-title" style="margin-bottom: 0; border-bottom: none;">
                                <i class="fas fa-file-invoice me-2" style="color: #FF9500;"></i>Required Permits
                            </h4>
                            <a href="/job-scope-wizard.html?jobId=${jobId}" class="permit-wizard-btn" style="margin-bottom: 0;">
                                <i class="fas fa-magic me-2"></i>Job Options Wizard
                            </a>
                        </div>
                        <hr>
                        ${permitsHtml}
                    </div>

                    <!-- Next Steps -->
                    <div class="detail-card">
                        <h4 class="section-title">
                            <i class="fas fa-tasks me-2" style="color: #FF9500;"></i>Next Steps
                        </h4>
                        <div style="background: linear-gradient(135deg, rgba(102, 126, 234, 0.1) 0%, rgba(118, 75, 162, 0.1) 100%); padding: 20px; border-radius: 8px;">
                            <ol style="margin-bottom: 0;">
                                <li><strong>Define Job Scope</strong> - Use Job Options Wizard to select scopes (Exterior, Structural, Electrical, etc.)</li>
                                <li><strong>Auto-Generate Permits</strong> - System auto-generates required MA permits based on selected scopes</li>
                                <li><strong>Prepare Applications</strong> - Collect required documentation for each permit</li>
                                <li><strong>Submit to Municipalities</strong> - File applications with applicable jurisdictions</li>
                                <li><strong>Track Approval</strong> - Monitor permit status and follow up with departments</li>
                                <li><strong>Schedule Inspections</strong> - Once permits approved, schedule required inspections</li>
                            </ol>
                        </div>
                    </div>
                `;

                document.getElementById('pageContent').innerHTML = html;
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('pageContent').innerHTML = `<div class="alert alert-danger">Error loading job details: ${error.message}</div>`;
            }
        }
    </script>
</body>
</html>
