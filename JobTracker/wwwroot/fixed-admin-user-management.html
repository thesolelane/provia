<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Management - Admin Panel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .main-content {
            margin-left: 0;
            padding: 20px;
        }
        .user-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            border-left: 4px solid #007bff;
            transition: all 0.3s ease;
        }
        .user-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(0,0,0,0.12);
        }
        .role-badge {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 600;
        }
        .role-admin { background-color: #dc3545; color: white; }
        .role-supervisor { background-color: #fd7e14; color: white; }
        .role-field-operator { background-color: #198754; color: white; }
        .stats-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 30px;
        }
        .btn-outline-primary:hover, .btn-outline-danger:hover {
            transform: scale(1.05);
        }
        .modal-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .form-control:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
        }
        .btn-primary:hover {
            background: linear-gradient(135deg, #5a6fd8 0%, #6a4190 100%);
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="main-content">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2><i class="fas fa-users me-2"></i>Team Management</h2>
                <button class="btn btn-primary" onclick="showAddUserModal()">
                    <i class="fas fa-plus me-2"></i>Add Team Member
                </button>
            </div>

            <div class="stats-card">
                <div class="row">
                    <div class="col-md-3">
                        <h4 id="totalUsers">Loading...</h4>
                        <p class="mb-0">Total Team Members</p>
                    </div>
                    <div class="col-md-3">
                        <h4 id="adminCount">-</h4>
                        <p class="mb-0">Administrators</p>
                    </div>
                    <div class="col-md-3">
                        <h4 id="supervisorCount">-</h4>
                        <p class="mb-0">Supervisors</p>
                    </div>
                    <div class="col-md-3">
                        <h4 id="fieldOperatorCount">-</h4>
                        <p class="mb-0">Field Operators</p>
                    </div>
                </div>
            </div>

            <div id="usersList">
                <div class="text-center py-5">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                    <p class="mt-3">Loading team members...</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Add User Modal -->
    <div class="modal fade" id="addUserModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title"><i class="fas fa-user-plus me-2"></i>Add New Team Member</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="addUserForm">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">First Name *</label>
                                <input type="text" class="form-control" id="firstName" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Last Name *</label>
                                <input type="text" class="form-control" id="lastName" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Role *</label>
                            <select class="form-select" id="userRole" onchange="updateLoginFields()" required>
                                <option value="">Select Role</option>
                                <option value="1510">Admin</option>
                                <option value="1520">Supervisor</option>
                                <option value="2001">Field Operator</option>
                            </select>
                            <div id="roleDescription" class="form-text">
                                <small><strong>Role Information:</strong> Select a role to see login requirements</small>
                            </div>
                        </div>

                        <div id="emailLoginFields" style="display: none;">
                            <div class="mb-3">
                                <label class="form-label">Email Address *</label>
                                <input type="email" class="form-control" id="email">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Password *</label>
                                <input type="password" class="form-control" id="password">
                            </div>
                        </div>

                        <div id="phoneLoginFields" style="display: none;">
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Phone Number *</label>
                                    <input type="tel" class="form-control" id="phoneNumber">
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">PIN (4 digits) *</label>
                                    <input type="password" class="form-control" id="pin" maxlength="4" pattern="[0-9]{4}">
                                </div>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Language Preference</label>
                            <select class="form-select" id="languagePreference">
                                <option value="en">English</option>
                                <option value="es">Spanish</option>
                            </select>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" onclick="createUser()">
                        <i class="fas fa-save me-2"></i>Create User
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function showAddUserModal() {
            document.getElementById('addUserForm').reset();
            document.getElementById('emailLoginFields').style.display = 'none';
            document.getElementById('phoneLoginFields').style.display = 'none';
            document.getElementById('roleDescription').innerHTML = '<small><strong>Role Information:</strong> Select a role to see login requirements</small>';
            new bootstrap.Modal(document.getElementById('addUserModal')).show();
        }

        function updateLoginFields() {
            const role = document.getElementById('userRole').value;
            const emailFields = document.getElementById('emailLoginFields');
            const phoneFields = document.getElementById('phoneLoginFields');
            const description = document.getElementById('roleDescription');

            emailFields.style.display = 'none';
            phoneFields.style.display = 'none';

            if (role === '1510' || role === '1520') {
                emailFields.style.display = 'block';
                if (role === '1510') {
                    description.innerHTML = '<small><strong>Admin:</strong> Full system access with email login</small>';
                } else {
                    description.innerHTML = '<small><strong>Supervisor:</strong> Manage field operators and locations with email login</small>';
                }
            } else if (role === '2001') {
                phoneFields.style.display = 'block';
                description.innerHTML = '<small><strong>Field Operator:</strong> Field work access with phone and PIN login</small>';
            } else {
                description.innerHTML = '<small><strong>Role Information:</strong> Select a role to see login requirements</small>';
            }
        }

        function editUser(userId) {
            alert('Edit user function called for user ID: ' + userId);
        }

        function deactivateUser(userId) {
            const reason = prompt('Please provide a reason for deactivation (optional):');
            if (reason === null) return;
            
            const notes = prompt('Additional notes (optional):');
            if (notes === null) return;

            if (!confirm('Are you sure you want to permanently deactivate this user? Their credentials will be archived and the account cannot be reused.')) {
                return;
            }

            alert('Deactivate user function called for user ID: ' + userId + '\nReason: ' + (reason || 'None') + '\nNotes: ' + (notes || 'None'));
        }

        async function createUser() {
            const formData = {
                firstName: document.getElementById('firstName').value,
                lastName: document.getElementById('lastName').value,
                role: parseInt(document.getElementById('userRole').value),
                languagePreference: document.getElementById('languagePreference').value
            };

            const role = document.getElementById('userRole').value;
            if (role === '1510' || role === '1520') {
                formData.email = document.getElementById('email').value;
                formData.password = document.getElementById('password').value;
            } else if (role === '2001') {
                formData.phoneNumber = document.getElementById('phoneNumber').value;
                formData.pin = document.getElementById('pin').value;
            }

            alert('Create user function called with data: ' + JSON.stringify(formData, null, 2));
        }

        function loadUsers() {
            setTimeout(() => {
                const usersList = document.getElementById('usersList');
                usersList.innerHTML = `
                    <div class="user-card">
                        <div class="row align-items-center">
                            <div class="col-md-3">
                                <div class="d-flex align-items-center">
                                    <div class="bg-danger text-white rounded-circle d-flex align-items-center justify-content-center me-3" style="width: 50px; height: 50px;">
                                        <strong>AD</strong>
                                    </div>
                                    <div>
                                        <h6 class="mb-1">Admin User</h6>
                                        <small class="text-muted">admin@example.com</small>
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-2">
                                <span class="role-badge role-admin">Admin</span>
                            </div>
                            <div class="col-md-2">
                                <span class="badge bg-success">Active</span>
                            </div>
                            <div class="col-md-3">
                                <small class="text-muted">ID: 36DMRD-1520-001</small>
                            </div>
                            <div class="col-md-2 text-end">
                                <button class="btn btn-sm btn-outline-primary me-1" onclick="editUser(1)">
                                    <i class="fas fa-edit"></i>
                                </button>
                                <button class="btn btn-sm btn-outline-danger" onclick="deactivateUser(1)">
                                    <i class="fas fa-user-slash"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                `;

                document.getElementById('totalUsers').textContent = '1';
                document.getElementById('adminCount').textContent = '1';
                document.getElementById('supervisorCount').textContent = '0';
                document.getElementById('fieldOperatorCount').textContent = '0';
            }, 1000);
        }

        document.addEventListener('DOMContentLoaded', function() {
            loadUsers();
        });
    </script>
</body>
</html>
