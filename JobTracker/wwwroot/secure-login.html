<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Tracker - Secure Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .login-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
            width: 100%;
            max-width: 400px;
        }
        .login-header {
            background: linear-gradient(135deg, #dc3545 0%, #c82333 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        .login-body {
            padding: 40px 30px;
        }
        .form-control {
            border-radius: 10px;
            border: 2px solid #e9ecef;
            padding: 12px 20px;
            margin-bottom: 20px;
            transition: all 0.3s ease;
        }
        .form-control:focus {
            border-color: #dc3545;
            box-shadow: 0 0 0 0.2rem rgba(220, 53, 69, 0.25);
        }
        .btn-login {
            background: linear-gradient(135deg, #dc3545 0%, #c82333 100%);
            border: none;
            border-radius: 10px;
            padding: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
        }
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(220, 53, 69, 0.3);
        }
        .login-tabs {
            display: flex;
            margin-bottom: 30px;
        }
        .login-tab {
            flex: 1;
            padding: 10px;
            text-align: center;
            background: #f8f9fa;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .login-tab.active {
            background: #dc3545;
            color: white;
        }
        .login-tab:first-child {
            border-radius: 10px 0 0 10px;
        }
        .login-tab:last-child {
            border-radius: 0 10px 10px 0;
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
        .alert {
            border-radius: 10px;
            margin-bottom: 20px;
        }
        .demo-credentials {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 15px;
            margin-top: 20px;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h3><i class="fas fa-hard-hat me-2"></i>Job Tracker</h3>
            <p class="mb-0">Preferred Builders USA, LLC</p>
        </div>
        <div class="login-body">
            <div class="login-tabs">
                <button class="login-tab active" onclick="switchTab('email')">
                    <i class="fas fa-envelope me-2"></i>Email Login
                </button>
                <button class="login-tab" onclick="switchTab('phone')">
                    <i class="fas fa-mobile-alt me-2"></i>Phone Login
                </button>
            </div>

            <div id="emailTab" class="tab-content active">
                <form id="emailLoginForm">
                    <div class="mb-3">
                        <div class="input-group">
                            <span class="input-group-text"><i class="fas fa-envelope"></i></span>
                            <input type="text" class="form-control" id="emailIdentifier" placeholder="Email or Username" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <div class="input-group">
                            <span class="input-group-text"><i class="fas fa-lock"></i></span>
                            <input type="password" class="form-control" id="emailPassword" placeholder="Password" required>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-danger btn-login w-100">
                        <i class="fas fa-sign-in-alt me-2"></i>Login
                    </button>
                </form>

                <div class="demo-credentials">
                    <strong>Demo Credentials:</strong><br>
                    <small>
                        Admin: admin@preferredbuildersusa.com / admin123<br>
                        Supervisor: erika.silva@preferredbuildersusa.com / supervisor123
                    </small>
                </div>
            </div>

            <div id="phoneTab" class="tab-content">
                <form id="phoneLoginForm">
                    <div class="mb-3">
                        <div class="input-group">
                            <span class="input-group-text"><i class="fas fa-mobile-alt"></i></span>
                            <input type="tel" class="form-control" id="phoneNumber" placeholder="Phone Number" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <div class="input-group">
                            <span class="input-group-text"><i class="fas fa-key"></i></span>
                            <input type="password" class="form-control" id="phonePin" placeholder="4-Digit PIN" maxlength="4" required>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-danger btn-login w-100">
                        <i class="fas fa-sign-in-alt me-2"></i>Login
                    </button>
                </form>

                <div class="demo-credentials">
                    <strong>Demo Credentials:</strong><br>
                    <small>
                        Field Operator: (978) 320-1714 / 1234<br>
                        Mike Johnson: (978) 320-1714 / 1234
                    </small>
                </div>
            </div>

            <div id="loginAlert" class="alert" style="display: none;"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function switchTab(tabName) {
            // Update tab buttons
            document.querySelectorAll('.login-tab').forEach(tab => {
                tab.classList.remove('active');
            });
            event.target.classList.add('active');

            // Update tab content
            document.querySelectorAll('.tab-content').forEach(content => {
                content.classList.remove('active');
            });
            document.getElementById(tabName + 'Tab').classList.add('active');

            // Clear alert
            hideAlert();
        }

        function showAlert(message, type = 'danger') {
            const alertDiv = document.getElementById('loginAlert');
            alertDiv.className = `alert alert-${type}`;
            alertDiv.innerHTML = `<i class="fas fa-exclamation-triangle me-2"></i>${message}`;
            alertDiv.style.display = 'block';
        }

        function hideAlert() {
            document.getElementById('loginAlert').style.display = 'none';
        }

        // Email login form handler
        document.getElementById('emailLoginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            hideAlert();

            const identifier = document.getElementById('emailIdentifier').value;
            const password = document.getElementById('emailPassword').value;

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        identifier: identifier,
                        password: password
                    })
                });

                const data = await response.json();

                if (response.ok && data.token) {
                    // Store token and user info
                    localStorage.setItem('authToken', data.token);
                    localStorage.setItem('userInfo', JSON.stringify(data.user));
                    
                    showAlert('Login successful! Redirecting...', 'success');
                    
                    // Redirect based on role
                    setTimeout(() => {
                        if (data.user.role === 1510) { // Admin
                            window.location.href = '/dashboard.html';
                        } else if (data.user.role === 1520) { // Supervisor
                            window.location.href = '/supervisor-dashboard.html';
                        } else {
                            window.location.href = '/field-operator-dashboard.html';
                        }
                    }, 1000);
                } else {
                    showAlert(data.message || 'Login failed. Please check your credentials.');
                }
            } catch (error) {
                console.error('Login error:', error);
                showAlert('An error occurred during login. Please try again.');
            }
        });

        // Phone login form handler
        document.getElementById('phoneLoginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            hideAlert();

            const phoneNumber = document.getElementById('phoneNumber').value;
            const pin = document.getElementById('phonePin').value;

            try {
                const response = await fetch('/api/auth/phone-login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        phoneNumber: phoneNumber,
                        pin: pin
                    })
                });

                const data = await response.json();

                if (response.ok && data.token) {
                    // Store token and user info
                    localStorage.setItem('authToken', data.token);
                    localStorage.setItem('userInfo', JSON.stringify(data.user));
                    
                    showAlert('Login successful! Redirecting...', 'success');
                    
                    // Redirect to field operator dashboard
                    setTimeout(() => {
                        window.location.href = '/field-operator-dashboard.html';
                    }, 1000);
                } else {
                    showAlert(data.message || 'Login failed. Please check your phone number and PIN.');
                }
            } catch (error) {
                console.error('Phone login error:', error);
                showAlert('An error occurred during login. Please try again.');
            }
        });

        // Check if user is already logged in
        window.addEventListener('load', function() {
            const token = localStorage.getItem('authToken');
            const userInfo = localStorage.getItem('userInfo');
            
            if (token && userInfo) {
                const user = JSON.parse(userInfo);
                // Redirect based on role
                if (user.role === 1510) { // Admin
                    window.location.href = '/dashboard.html';
                } else if (user.role === 1520) { // Supervisor
                    window.location.href = '/supervisor-dashboard.html';
                } else {
                    window.location.href = '/field-operator-dashboard.html';
                }
            }
        });
    </script>
</body>
</html>
