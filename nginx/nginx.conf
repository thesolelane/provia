# ============================================================
# PROVIA - Nginx Configuration
# Reverse proxy: routes traffic to the .NET app on port 5000
#
# SSL Setup (Let's Encrypt):
#   1. Install Certbot: apt install certbot python3-certbot-nginx
#   2. Run: certbot --nginx -d yourdomain.com -d www.yourdomain.com
#   3. Certbot will update this file automatically
#   OR manually uncomment the HTTPS server block below
# ============================================================

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile        on;
    keepalive_timeout 65;
    client_max_body_size 50M;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1000;

    # ----------------------------------------------------------
    # HTTP — redirects all traffic to HTTPS
    # (When not yet using SSL, comment out the redirect block
    #  and use the proxy_pass block instead for initial testing)
    # ----------------------------------------------------------
    server {
        listen 80;
        server_name _;

        # Let's Encrypt ACME challenge (needed for cert renewal)
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Redirect all HTTP to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }

        # TEMPORARY: Comment the redirect above and uncomment below
        # to test without SSL before setting up Let's Encrypt
